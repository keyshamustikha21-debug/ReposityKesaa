<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Les/KUrsus</title>

    <style>
        body {
            font-family: arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 600px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #24527a;
        }

        .deksripsi {
            text-align: center;
            color: #666;
        }

        fieldset {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #d6e2ec;
            border-radius: 8px;
        }

        legend  {
            font-weight: bold;
            color: #24527a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type= "text"],
        input[type= "email"],
        input[type= "tel"],
        input[type= "date"],
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .pilihan {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .pilihan label {
            font-weight: normal;
        }

        input[type= "file"] {
            width: 100%;
        }

        .submit {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 30px;
            background-color: #24527a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #173b59;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Form Pendaftaran Les/Kursus</h1>
        <p class="deskripsi">Silahkan Isi Data Dengan Benar dan Jelas</p>
        <form action="https://rplcoder.com/proses.php" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Data Siswa</legend>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text"
                           id="nama"
                           name="nama"
                           placeholder="Masukkan nama lengkap"
                           required>
                </div>

                <div class="form-group">
                    <label for="nis">NIS</label>
                    <input type="text"
                           id="nis"
                           name="nis"
                           placeholder="Masukkan NIS"
                           required>
                </div>

                <div class="form-group">
                    <label for="tanggal_lahir">Tanggal Lahir</label>
                    <input type="date"
                           id="tanggal_lahir"
                           name="tanggal_lahir"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="contoh@email.com"
                           required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pilihan Kursus</legend>
                <div class="form-group">
                    <label for="kelas">Kelas</label>

                    <select id="kelas" name="kelas" required>
                        <option value="">-- Pilih Kelas --</option>
                        <option value="X">Kelas X</option>
                        <option value="XI">Kelas XI</option>
                        <option value="XII">Kelas XII</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pelajaran">Mata Pelajaran</label>

                    <select id="pelajaran"
                            name="pelajaran"
                            required>

                        <option value="">
                            -- Pilih Mata Pelajaran --
                        </option>

                        <option value="Matematika">
                            Matematika
                        </option>

                        <option value="Bahasa Indonesia">
                            Bahasa Indonesia
                        </option>

                        <option value="Bahasa Inggris">
                            Bahasa Inggris
                        </option>

                        <option value="Pemrograman">
                            Pemrograman
                        </option>

                        <option value="Desain Grafis">
                            Desain Grafis
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Metode Pembelajaran</label>

                    <div class="pilihan">

                        <label>
                            <input type="radio"
                                   name="metode"
                                   value="Tatap Muka"
                                   required>
                            Tatap Muka
                        </label>

                        <label>
                            <input type="radio"
                                   name="metode"
                                   value="Online">
                            Online
                        </label>

                    </div>
                </div>

                <div class="form-group">
                    <label>Materi Tambahan</label>

                    <div class="pilihan">

                        <label>
                            <input type="checkbox"
                                   name="materi[]"
                                   value="Latihan Soal">
                            Latihan Soal
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="materi[]"
                                   value="Tugas">
                            Tugas
                        </label>

                        <label>
                            <input type="checkbox"
                                   name="materi[]"
                                   value="Persiapan Ujian">
                            Persiapan Ujian
                        </label>

                    </div>
                </div>

            </fieldset>

            <fieldset>
                <legend>Informasi Tambahan</legend>

                <div class="form-group">
                    <label for="alasan">
                        Alasan Mengikuti Les/Kursus
                    </label>

                    <textarea id="alasan"
                              name="alasan"
                              placeholder="Tuliskan alasan mengikuti les/kursus..."
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="kartu_pelajar">
                        Upload Kartu Pelajar
                    </label>

                    <input type="file"
                           id="kartu_pelajar"
                           name="kartu_pelajar"
                           accept=".jpg,.jpeg,.png,.pdf"
                           required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Persetujuan</legend>

                <label>
                    <input type="checkbox"
                           name="persetujuan"
                           value="Setuju"
                           required>

                    Saya menyatakan bahwa data yang saya isi
                    sudah benar.
                </label>

            </fieldset>

            <div class="submit">
                <button type="submit">
                    Daftar Kursus
                </button>
            </div>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
